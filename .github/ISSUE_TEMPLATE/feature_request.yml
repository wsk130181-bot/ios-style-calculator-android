name: Feature Request / 功能请求
description: Suggest an idea for this project / 为本项目提供建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.
        感谢您提出功能建议！请在下方描述您的想法。

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? / 您的功能请求是否与某个问题相关？
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like / 描述您希望的解决方案
      description: A clear and concise description of what you want to happen.
      placeholder: I would like to be able to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered / 描述您考虑过的替代方案
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: I considered X, but Y would be better because...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context / 其他信息
      description: Add any other context or screenshots about the feature request here.
      placeholder: Any additional information that might help.
    validations:
      required: false
